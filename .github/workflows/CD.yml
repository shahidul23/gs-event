name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker
        run: |
          docker --version
          docker compose version

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Production Environment
        run: |
          if [ ! -f /home/reddata/gsevent/.env ]; then
              echo "ERROR: Production .env does not exist."
              exit 1
          fi
          cp /home/reddata/gsevent/.env .env
          echo "Production .env copied successfully."

      - name: Validate Docker Compose
        run: |
          docker compose config --quiet

      - name: Pull Latest Images
        run: |
          docker compose pull

      - name: Run Database Migrations
        run: |
          docker compose run --rm api dotnet ef database update

      - name: Deploy Application
        run: |
          docker compose up -d --remove-orphans

      - name: Show Running Containers
        run: |
          docker compose ps

      - name: Wait for Application
        run: |
          echo "Waiting for services to start..."
          sleep 15

      - name: Check Frontend
        run: |
          if curl --fail --silent --show-error http://localhost:3000 > /dev/null; then
            echo "Frontend is healthy."
          else
            echo "Frontend health check failed."
            exit 1
          fi

      - name: Check Backend
        run: |
          if curl --fail --silent --show-error http://localhost:8080/swagger/index.html > /dev/null || curl --fail --silent --show-error http://localhost:8080/api > /dev/null; then
            echo "Backend is reachable."
          else
            echo "Backend health check failed."
            exit 1
          fi

      - name: Show Application Logs
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=100

      - name: Cleanup Old Docker Images
        if: success()
        run: |
          docker image prune -f

      - name: Deployment Successful
        if: success()
        run: |
          echo "========================================="
          echo " GSEvent deployment successful"
          echo "========================================="
          echo "Commit: $GITHUB_SHA"
          echo "Server: $(hostname)"
          echo "Time: $(date)"