name: CD

on:

  push:
    branches:
      - main

  workflow_dispatch:


permissions:
  contents: read
  packages: write


jobs:

  docker:
    name: Build and Push Docker Images

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Login to GHCR
        uses: docker/login-action@v3

        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build and Push Backend
        uses: docker/build-push-action@v6

        with:
          context: ./GSEvent
          file: ./GSEvent/Dockerfile

          push: true

          tags: |
            ghcr.io/shahidul23/gsevent-api:latest
            ghcr.io/shahidul23/gsevent-api:${{ github.sha }}


      - name: Build and Push Frontend
        uses: docker/build-push-action@v6

        with:
          context: ./frontend
          file: ./frontend/Dockerfile

          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}

          push: true

          tags: |
            ghcr.io/shahidul23/gsevent-frontend:latest
            ghcr.io/shahidul23/gsevent-frontend:${{ github.sha }}