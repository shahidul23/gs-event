name: Runner Test

on:
  push:

jobs:
  test:
    name: Test Self-Hosted Runner

    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Runner Information
        run: |
          echo "========================================"
          echo "GitHub Actions Self-Hosted Runner"
          echo "========================================"
          echo "User: $(whoami)"
          echo "Hostname: $(hostname)"
          echo "Working Directory: $(pwd)"
          echo "Operating System:"
          uname -a
          echo ""

      - name: Check Git
        run: |
          echo "Git Version:"
          git --version
          echo ""

      - name: Check Docker
        run: |
          echo "Docker Version:"
          docker --version
          echo ""

          echo "Docker Compose Version:"
          docker compose version
          echo ""

          echo "Running Containers:"
          docker ps
          echo ""

      - name: Check .NET
        run: |
          echo ".NET Version:"
          dotnet --version
          echo ""

          echo ".NET SDK Information:"
          dotnet --info

      - name: Check Repository
        run: |
          echo "========================================"
          echo "Repository Information"
          echo "========================================"
          echo "Current Directory:"
          pwd
          echo ""

          echo "Repository Files:"
          ls -la
          echo ""

      - name: Test Completed
        run: |
          echo "========================================"
          echo "SUCCESS"
          echo "GitHub Actions Runner is working correctly!"
          echo "========================================"
