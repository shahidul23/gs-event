name: CI
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore GSEvent/GSEvent.csproj
      - name: Build
        run: dotnet build GSEvent/GSEvent.csproj --no-restore --configuration Release
      - name: Test
        run: dotnet test --configuration Release --no-build
