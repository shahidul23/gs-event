<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gulshan Society Event Management System" />
    <meta name="author" content="Gulshan Society" />
    <title>Gulshan Society</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      const userMode = localStorage.getItem('coreui-free-vue-admin-template-theme')
      const systemDarkMode =
        window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
      if (userMode === 'dark' || (userMode !== 'light' && systemDarkMode)) {
        document.documentElement.dataset.coreuiTheme = 'dark'
      }
    </script>
  </head>
  <body>
    <noscript>
      <strong>
        We're sorry, but GSEvent doesn't work properly without JavaScript enabled. Please enable
        JavaScript to continue.
      </strong>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
